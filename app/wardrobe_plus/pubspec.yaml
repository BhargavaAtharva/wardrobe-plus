name: wardrobe_plus
description: ACloset AI - Smart Wardrobe Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests to Flask backend
  http: ^1.2.0
  
  # Camera and image picking
  image_picker: ^1.0.7
  
  # Local database
  sqflite: ^2.3.2
  path: ^1.9.0
  
  # Shared preferences (for onboarding state)
  shared_preferences: ^2.2.2
  
  # Fonts
  google_fonts: ^6.2.1

  # Permanent storage folder for clothing photos
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Lets the integration test feed a photo to the Add screen
  image_picker_platform_interface: ^2.11.1
  # Real SQLite in unit tests (runs on the Mac, no simulator needed)
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true